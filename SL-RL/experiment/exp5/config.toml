representation = "raw"
seeds = [7, 19, 31]
architectures = [[128], [64, 64], [128, 128]]
reuse_matching_exp2 = true

[game]
height = 3
width = 10
max_ticks = 64
respawn_delay = 0

# raw 모델의 기존 체크포인트 인터페이스용. 인코더는 사용하지 않습니다.
[ssl]
latent = 16

[ppo]
hidden = 128
entity_hidden = 32
updates = 400
episodes_per_update = 8
epochs = 4
batch_size = 256
learning_rate = 0.0003
gamma = 0.99
gae_lambda = 0.95
clip = 0.2
entropy = 0.01
value_weight = 0.5
max_grad_norm = 0.5
checkpoint_every = 20
alpha = 1.0

[finetune]
updates = 400
episodes_per_update = 8
learning_rate = 0.0001
gap_shaping = 0.25
validation_every = 20
validation_games = 20
validation_seed = 246851

[evaluation]
seed = 246853
games = 40
