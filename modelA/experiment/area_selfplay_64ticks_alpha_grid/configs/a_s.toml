# 64틱 실험 전용 설정입니다. α와 시드는 명령행에서 덮어쓸 수 있습니다.

[game]
height = 3
width = 10
max_ticks = 64
respawn_delay = 0
initial_placement = "frontier"
rules_version = "territory_v1"

[reward]
mode = "A-S"
signal = "area_share"
team_weight = 1.0
capture_weight = 1.0

[model]
hidden_size = 128
previous_actions = false

[train]
seed = 7
updates = 400
episodes_per_update = 8
checkpoint_every = 5

[ppo]
learning_rate = 0.0003
gamma = 0.99
gae_lambda = 0.95
clip_ratio = 0.2
entropy_coef = 0.01
value_coef = 0.5
max_grad_norm = 0.5
epochs = 4
minibatch_size = 256

[evaluation]
seed = 20261120
deterministic = true
mirror_to_training_side = true

[evaluation.opponents]
expand = 40
random = 40
defend = 40

[runtime]
device = "cpu"
threads = 1
