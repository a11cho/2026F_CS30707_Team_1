[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "territory-rl"
version = "0.1.0"
description = "Simultaneous 3v3 territory-control MARL environment"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "gymnasium==1.2.3", "pettingzoo==1.25.0"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
territory-play = "territory_rl.cli:main"

[tool.setuptools.packages.find]
include = ["territory_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

